[project]
name = "product-oracle"
version = "0.1.0"
description = "Multi-agent world simulation for predicting how products and scenarios land across countries, jobs and segments."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "sse-starlette>=2.1",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "litellm>=1.50",
  "networkx>=3.3",
  "numpy>=1.26",
  "aiosqlite>=0.20",
  "httpx>=0.27",
  "ddgs>=9.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["oracle*"]

[tool.setuptools.package-data]
oracle = ["data/*.json"]
